<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
<title>PalmCadence</title>
<link rel="stylesheet" href="player.css">
</head>
<body class="show-library">
<div id="header" role="banner">
  <img src="icon.png" alt="" width="32" height="32">
  <h1>PalmCadence <span>掌弦</span></h1>
  <button id="settings-button" type="button" aria-label="检查网络">网络</button>
</div>
<form id="search">
  <label class="sr-only" for="query">歌曲或歌手</label>
  <span class="magnifier" aria-hidden="true"></span>
  <input id="query" placeholder="搜索歌曲或歌手" autocomplete="off" maxlength="80">
  <button type="submit">搜索</button>
</form>
<div id="sources" role="group" aria-label="音乐来源"><button type="button" data-source="netease" class="active">网易云</button><button type="button" data-source="tencent">QQ 音乐</button><button type="button" data-source="kuwo">酷我</button><button type="button" data-source="kugou">酷狗</button><button type="button" data-source="apple">Apple Music</button></div>
<div id="results" class="sheet" role="main">
  <div id="empty-state">
    <div class="record-art" aria-hidden="true"><span class="record-groove"></span><span class="record-label"></span></div>
    <h2>今天听什么？</h2>
    <p>搜索喜欢的歌曲或歌手。</p>
  </div>
  <h2 id="results-heading" class="hidden">搜索结果</h2>
  <p id="search-status" class="hidden" role="status"></p>
  <ul id="tracks"></ul>
  <button id="more" type="button" class="hidden">加载更多</button>
</div>
<div id="tablet-now" role="region" aria-label="正在播放">
  <div class="tablet-track">
    <div class="record-art" aria-hidden="true"><span class="record-groove"></span><span class="record-label"></span></div>
    <h2 id="tablet-title">未播放</h2>
    <p id="tablet-info"></p>
  </div>
</div>
<div id="store-panel" class="sheet detail hidden" role="region" aria-label="Apple Music 曲目">
  <button id="store-close" type="button" class="back">‹ 返回列表</button>
  <div class="record-art apple-record" aria-hidden="true"><span class="record-groove"></span><span class="record-label"></span></div>
  <h2 id="store-title"></h2>
  <p id="store-artist"></p>
  <a id="store-link" target="_blank" rel="noopener">在 Apple Music 打开</a>
  <p id="store-preview-info" class="hidden">试听由 iTunes 提供</p>
  <audio id="store-audio" x-palm-media-audio-class="media" class="hidden" preload="none" controls controlslist="nodownload"></audio>
  <a id="store-badge" class="hidden" target="_blank" rel="noopener"><img src="itunes-badge.gif" alt="Download on iTunes" width="110" height="40"></a>
  <p id="store-status" role="status"></p>
</div>
<div id="now-panel" class="sheet detail hidden" role="region" aria-label="正在播放">
  <button id="now-close" type="button" class="back">‹ 返回列表</button>
  <div id="now-record" class="record-art" aria-hidden="true"><span class="record-groove"></span><span class="record-label"></span></div>
  <h2 id="detail-title"></h2>
  <p id="detail-info"></p>
  <p id="detail-status"></p>
</div>
<div id="settings" class="sheet detail hidden" role="region" aria-label="网络">
  <button id="settings-close" type="button" class="back">‹ 返回列表</button>
  <h2>网络</h2>
  <p>请将设备连接到 Wi-Fi，或打开移动数据。</p>
  <p id="connection-status" role="status"></p>
  <button id="settings-retry" type="button">重新检查</button>
</div>
<div id="player" role="region" aria-label="播放控制">
  <div id="progress" role="slider" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><div class="progress-track"><span id="progress-fill"></span></div></div>
  <button id="playing" type="button" aria-label="打开正在播放" disabled>
    <span id="now-art" class="track-art" aria-hidden="true"></span>
    <span id="now-title">未播放</span>
    <span id="now-info">从搜索结果选择歌曲</span>
  </button>
  <div id="controls">
    <button id="previous" type="button" aria-label="上一首" disabled><span class="skip back-skip"></span></button>
    <button id="toggle" type="button" aria-label="播放" disabled><span class="play-symbol"></span></button>
    <button id="next" type="button" aria-label="下一首" disabled><span class="skip"></span></button>
  </div>
  <span id="player-time">0:00 / 0:00</span>
  <span id="player-status" role="status"></span>
  <a id="provider-link" class="hidden" target="_blank" rel="noopener">原平台 ›</a>
  <audio id="audio" x-palm-media-audio-class="media" preload="none"></audio>
</div>
<script src="player.js"></script>
</body>
</html>
